<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Buddy | Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            background: #f7f4ec;
        }

        .left {
            width: 45%;
            background: #123d2b;
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .left h1 {
            font-size: 48px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .left p {
            font-size: 17px;
            line-height: 1.6;
            color: #d9e5dd;
            max-width: 450px;
        }

        .right {
            width: 55%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .signup-box {
            width: 100%;
            max-width: 470px;
        }

        .signup-box h2 {
            font-size: 34px;
            color: #123d2b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d5d1c8;
            border-radius: 10px;
            background: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #123d2b;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #123d2b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .signup-btn:hover {
            background: #1d5940;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #123d2b;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 800px) {
            body {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 40px 30px;
            }

            .left h1 {
                font-size: 36px;
            }

            .right {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="left">
        <div class="logo">🎓 Campus Buddy</div>

        <h1>Your campus,<br>simplified.</h1>

        <p>
            Create your student account and let Campus Buddy
            keep your campus information organized in one place.
        </p>
    </div>


    <div class="right">

        <div class="signup-box">

            <h2>Create your account</h2>

            <p class="subtitle">
                Join Campus Buddy as a student.
            </p>

            <form id="signupForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter your student ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">College Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="signup-btn">
                    Create Account
                </button>

            </form>

            <div class="message" id="message"></div>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>


    <script type="module">

        import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import { getAuth, createUserWithEmailAndPassword }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        import { firebaseConfig }
        from "./firebase-config.js";


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        document.getElementById("signupForm").addEventListener("submit", async function(e) {

            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const studentId = document.getElementById("studentId").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            const message = document.getElementById("message");


            if (password !== confirmPassword) {

                message.style.color = "red";
                message.textContent = "Passwords do not match.";

                return;
            }


            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                message.style.color = "green";
                message.textContent =
                    "Account created successfully! Redirecting...";


                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);


            } catch (error) {

                message.style.color = "red";

                if (error.code === "auth/email-already-in-use") {

                    message.textContent =
                        "An account with this email already exists.";

                } else if (error.code === "auth/weak-password") {

                    message.textContent =
                        "Password should be at least 6 characters.";

                } else if (error.code === "auth/invalid-email") {

                    message.textContent =
                        "Please enter a valid email address.";

                } else {

                    message.textContent =
                        error.message;
                }
            }

        });

    </script>

</body>
</html>
